<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>正在跳转到 湖南信息学院官网</title>
<meta http-equiv="refresh" content="0; url=https://www.hnuit.edu.cn/">
<script>
  // 备用：若 meta 刷新未生效，1 秒后强制跳转
  window.setTimeout(function(){ window.location.replace("https://www.hnuit.edu.cn/"); }, 1000);
</script>
<style>
  body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f4f6fb;color:#333;
       display:flex;align-items:center;justify-content:center;height:100vh;}
  .box{text-align:center;padding:40px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .box h1{font-size:22px;margin:0 0 12px;}
  .box p{color:#888;margin:0 0 20px;}
  .box a{color:#1664d8;text-decoration:none;font-weight:600;}
  .spin{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:#1664d8;border-radius:50%;
        margin:0 auto 18px;animation:r 1s linear infinite;}
  @keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>正在跳转到 湖南信息学院 官网…</h1>
    <p>如果页面未自动跳转，请点击下方链接</p>
    <a href="https://www.hnuit.edu.cn/">进入 www.hnuit.edu.cn</a>
  </div>
</body>
</html>
