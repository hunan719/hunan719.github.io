<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶蛋护送你前往 湖南信息学院</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Microsoft YaHei",Arial,sans-serif;
    background:linear-gradient(160deg,#ffe3f0 0%,#fff0f6 50%,#ffe9f1 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;color:#333;
  }
  .card{
    width:min(720px,92vw);text-align:center;
    background:#fff;border-radius:20px;
    box-shadow:0 12px 40px rgba(233,72,140,.18);
    padding:30px 24px 34px;border:1px solid #ffd3e4;
  }
  .card h1{font-size:26px;margin-bottom:6px;color:#e03e8b;}
  .sub{color:#b06a8a;font-size:15px;margin-bottom:20px;}
  .video-wrap{
    position:relative;width:100%;aspect-ratio:16/9;
    border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
  }
  .video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .tip{
    margin-top:18px;font-size:17px;font-weight:600;color:#e03e8b;
  }
  .tip span{display:inline-block;}
  .go-btn{
    display:none;margin-top:16px;
    padding:12px 34px;font-size:16px;font-weight:600;
    color:#fff;background:linear-gradient(90deg,#ff6fa5,#e03e8b);
    border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 18px rgba(224,62,139,.35);
  }
  .go-btn.show{display:inline-block;}
  .footer{margin-top:20px;font-size:12px;color:#c99bb1;}
</style>
</head>
<body>
  <div class="card">
    <h1>奶蛋 欢迎你</h1>
    <p class="sub">正在护送你前往 · 湖南信息学院官网</p>
    <div class="video-wrap">
      <video id="mv" autoplay muted playsinline preload="auto"
             src="https://aka.doubaocdn.com/s/WcLk2pXV6w"></video>
    </div>
    <div class="tip">正在护送… 马上为你打开官网</div>
    <button class="go-btn" id="go">立即前往 湖南信息学院官网</button>
    <div class="footer">本页由 hunannailong.xin 提供跳转入口</div>
  </div>

<script>
  var TARGET = "https://www.hnuit.edu.cn/";
  var vid = document.getElementById("mv");
  var goBtn = document.getElementById("go");
  var redirected = false;

  function go(){
    if(redirected) return;
    redirected = true;
    window.location.replace(TARGET);
  }

  // 备用：若页面加载很久仍未跳转（视频异常），10 秒后自动跳
  window.setTimeout(function(){
    if(!redirected){
      goBtn.classList.add("show");
    }
  }, 8000);

  // 点击按钮立即前往
  goBtn.addEventListener("click", go);

  // 视频播放结束 → 自动跳转
  vid.addEventListener("ended", function(){
    // 播完后稍作停顿再跳，让文字停留片刻
    window.setTimeout(go, 1200);
  });

  // 兜底：视频因故无法播放时，8 秒后直接跳
  vid.addEventListener("error", function(){
    window.setTimeout(go, 8000);
  });
  // 若浏览器无法自动播放，8 秒后直接跳
  window.setTimeout(function(){
    if(redirected) return;
    if(vid.readyState === 0 || vid.paused){
      window.setTimeout(go, 8000);
    }
  }, 3000);
</script>
</body>
</html>
